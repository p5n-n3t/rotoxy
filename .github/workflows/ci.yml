name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify isolated OAuth and Python supervisor wiring
        run: node scripts/verify-fleet-oauth.mjs
      - name: Verify durable supervisor and provider-independent Python behavior
        if: matrix.node == 22
        env:
          PYTHONPATH: supervisor
        run: python3 -m unittest discover -s supervisor/tests
