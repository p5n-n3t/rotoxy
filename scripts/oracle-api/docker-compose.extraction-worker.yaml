services:
  extraction-worker:
    build:
      context: .
      dockerfile: Dockerfile.extraction-worker
    image: rotoxy-oracle-extraction-worker:local
    container_name: rotoxy-oracle-extraction-worker
    restart: unless-stopped
    environment:
      ORACLE_API_TOKEN_FILE: /run/secrets/oracle-api-token
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "127.0.0.1:8878:8878"
      - "${TS_IP:?TS_IP must be set}:8878:8878"
    mem_limit: 512m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "from pathlib import Path; import urllib.request; token=Path('/run/secrets/oracle-api-token').read_text().strip(); req=urllib.request.Request('http://127.0.0.1:8878/health',headers={'Authorization':'Bearer '+token}); urllib.request.urlopen(req,timeout=2).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    secrets:
      - oracle-api-token

secrets:
  oracle-api-token:
    file: /etc/oracle-api/api-token
