services:
  oracle-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: oracle-api:local
    container_name: oracle-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8877:8877"
      - "${TS_IP}:8877:8877"
    mem_limit: 512m
    cpus: 0.5
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8877", "--workers", "1"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8877/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
