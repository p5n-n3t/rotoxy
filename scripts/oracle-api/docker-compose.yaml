services:
  searxng:
    image: ghcr.io/searxng/searxng:2026.10.30-ffa88e3ba
    container_name: oracle-searxng
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET must be provisioned by deploy-ora3.sh}
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: 8080
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  oracle-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: oracle-api:local
    container_name: oracle-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8877:8877"
      - "${TS_IP}:8877:8877"
    mem_limit: 512m
    cpus: 0.5
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8877", "--workers", "1"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8877/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
